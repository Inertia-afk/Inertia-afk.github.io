<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inertia-afk</title>
  <!-- Iconos de FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      /* Imagen de fondo genérica, puedes cambiar este link por tu propia imagen */
      background: #0d0f17 url('https://images.unsplash.com/photo-1578632767115-351597cf2477?q=80&w=1920') no-repeat center center/cover;
      color: #ffffff;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* Foto de perfil */
    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255, 255, 255, 0.2);
      margin-bottom: 14px;
    }

    .username {
      font-size: 1.35rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }

    .badge {
      color: #38bdf8;
      font-size: 0.95rem;
    }

    .subtitle {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.65);
      margin-bottom: 24px;
    }

    /* Botones de enlaces */
    .links-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 28px;
    }

    .link-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-radius: 12px;
      background: rgba(18, 22, 34, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: #ffffff;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .link-card:hover {
      background: rgba(35, 43, 66, 0.85);
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
    }

    .link-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .link-left i {
      font-size: 1.15rem;
      width: 20px;
      text-align: center;
    }

    /* Iconos inferiores */
    .social-icons {
      display: flex;
      gap: 16px;
    }

    .social-icons a {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(18, 22, 34, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(14px);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      text-decoration: none;
      transition: background 0.2s, transform 0.2s;
    }

    .social-icons a:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: scale(1.1);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Foto de perfil: reemplaza el link con tu imagen -->
    <img src="https://via.placeholder.com/150" alt="Avatar" class="avatar">

    <h1 class="username">
      Inertia-afk <i class="fa-solid fa-circle-check badge"></i>
    </h1>
    <p class="subtitle">Tiendas y Conexiones</p>

    <!-- Lista de botones (cambia los href="#" por tus enlaces) -->
    <div class="links-list">
      <a href="https://discord.com" target="_blank" class="link-card">
        <div class="link-left">
          <i class="fa-brands fa-discord"></i>
          <span>Añádeme en Discord</span>
        </div>
        <i class="fa-solid fa-arrow-right"></i>
      </a>

      <a href="https://paypal.me" target="_blank" class="link-card">
        <div class="link-left">
          <i class="fa-brands fa-paypal"></i>
          <span>Apoyar en PayPal</span>
        </div>
        <i class="fa-solid fa-arrow-right"></i>
      </a>

      <a href="https://ko-fi.com" target="_blank" class="link-card">
        <div class="link-left">
          <i class="fa-solid fa-mug-hot"></i>
          <span>Invítame un Ko-fi</span>
        </div>
        <i class="fa-solid fa-arrow-right"></i>
      </a>

      <a href="https://patreon.com" target="_blank" class="link-card">
        <div class="link-left">
          <i class="fa-brands fa-patreon"></i>
          <span>Tienda de Patreon</span>
        </div>
        <i class="fa-solid fa-arrow-right"></i>
      </a>
    </div>

    <!-- Iconos inferiores -->
    <div class="social-icons">
      <a href="https://instagram.com" target="_blank"><i class="fa-brands fa-instagram"></i></a>
      <a href="https://x.com" target="_blank"><i class="fa-brands fa-x-twitter"></i></a>
      <a href="https://tiktok.com" target="_blank"><i class="fa-brands fa-tiktok"></i></a>
    </div>
  </div>

</body>
</html>
